<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Redes - Unidad 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <!-- PANTALLA PARA ELEGIR MODO -->
        <section id="seleccionModo" class="panel seleccion-modo">

            <h1>🌐 Test de Redes</h1>
            <p>Unidad 1 - Introducción a las redes</p>

            <h2>Elige el modo del test</h2>

            <div class="botones-modo">

                <button id="modoNormal" class="boton modo">
                    📋 Modo normal
                    <span>Preguntas en orden</span>
                </button>

                <button id="modoAleatorio" class="boton modo">
                    🎲 Modo aleatorio
                    <span>Preguntas mezcladas</span>
                </button>

            </div>

        </section>


        <!-- TEST -->
        <section id="test" class="panel oculto">

            <div class="informacion">
                <span id="numeroPregunta">Pregunta 1 de 40</span>
                <span id="puntuacion">Puntos: 0</span>
            </div>

            <div class="barra-contenedor">
                <div id="barra-progreso"></div>
            </div>

            <h2 id="pregunta">Cargando pregunta...</h2>

            <div id="opciones" class="opciones"></div>

            <button id="botonSiguiente" class="boton" disabled>
                Siguiente →
            </button>

        </section>


        <!-- RESULTADO -->
        <section id="resultado" class="resultado oculto">

            <h2>🎉 Test terminado</h2>

            <div class="nota" id="nota">
                0/10
            </div>

            <p id="mensajeResultado"></p>

            <button id="botonReiniciar" class="boton">
                🔄 Volver a hacer el test
            </button>

        </section>

    </main>

    <script src="unidad_1.js"></script>

</body>
</html>
